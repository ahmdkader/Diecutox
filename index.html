<script>
function generate(){
  const L=+L_.value, W=+W_.value, H=+H_.value;
  const SW=+SW_.value, SH=+SH_.value;
  const glue=20, flap=Math.min(W/2,25);
  const dw=2*(L+W)+glue, dh=H+2*flap;

  // ===== التعشيش =====
  function grid(bw,bh){ 
    const c=Math.floor((SW+2)/bw), r=Math.floor((SH+2)/bh);
    return {c,r,n:c*r};
  }
  const a=grid(dw,dh), b=grid(dh,dw);
  const best=a.n>=b.n?a:b, rot=b.n>a.n;

  // ===== الرسم =====
  const cv=document.getElementById('cv');
  const maxW=cv.parentElement.clientWidth-20;
  const scale=Math.min(maxW/dw, 600/dh);
  cv.width=dw*scale+40; cv.height=dh*scale+40;
  const x=cv.getContext('2d');

  // خلفية بيضاء واضحة
  x.fillStyle='#ffffff';
  x.fillRect(0,0,cv.width,cv.height);

  x.save();
  x.translate(20,20);
  x.scale(scale,scale);
  x.lineWidth=Math.max(2/scale,0.5);   // خط سميك ومضمون

  // خطوط التثليث (الطي) - أزرق متقطع
  x.strokeStyle='#0066ff';
  x.setLineDash([5/scale,3/scale]);

  // الجسم: 4 ألواح (L,W,L,W)
  const panels=[L,W,L,W];
  let px=glue;
  panels.forEach(p=>{
    x.strokeRect(px,flap,p,H);
    px+=p;
  });

  // الفلابات العلوية والسفلية (شكل المنزل/الغطاء)
  x.beginPath();
  px=glue;
  panels.forEach(p=>{
    x.moveTo(px,flap);
    x.lineTo(px+p/2,flap-flap); // قمة الفلاب العلوي
    x.lineTo(px+p,flap);
    x.moveTo(px,flap+H);
    x.lineTo(px+p/2,flap+H+flap); // قمة الفلاب السفلي
    x.lineTo(px+p,flap+H);
    px+=p;
  });
  x.stroke();

  // خطوط القص (المحيط الخارجي) - أحمر سميك متصل
  x.setLineDash([]);
  x.strokeStyle='#e60000';
  x.lineWidth=Math.max(3/scale,0.8);
  x.strokeRect(glue,0,2*(L+W),dh);      // محيط الجسم + الفلابات
  x.strokeRect(0,flap,glue,H);          // اللزمة

  x.restore();

  // ===== النتيجة =====
  document.getElementById('result').style.display='block';
  const eff=((best.n*dw*dh/(SW*SH))*100).toFixed(1);
  document.getElementById('stats').innerHTML=
   `📐 مقاس الدايكت المسطّح: <b>dw×{dw} ×dw×{dh} مم</b><br>`+
   `🧩 القطع في الورقة (SW×{SW}×SW×{SH} مم): <b>best.nقطعة</b>({best.n} قطعة</b> (best.nقطعة</b>({best.c}×${best.r})`+
   (rot?' <span style="color:#2a9d8f">(مدوّرة 90°)</span>':'')+'<br>'+
   `♻️ كفاءة استغلال الورقة: <b>${eff}%</b>`;
}
</script>
