<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد الدايكت - Reverse Tuck End</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body { background:#1a1a2e; color:#eee; padding:15px; }
  h1 { text-align:center; color:#e94560; font-size:22px; margin-bottom:5px; }
  p.sub { text-align:center; color:#888; font-size:13px; margin-bottom:15px; }
  .card { background:#16213e; border-radius:12px; padding:15px; margin-bottom:15px; }
  label { display:block; margin:8px 0 4px; font-size:13px; color:#aaa; }
  input { width:100%; padding:9px; border-radius:8px; border:1px solid #333;
          background:#0f3460; color:#fff; font-size:15px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  h3 { color:#e94560; font-size:15px; margin:12px 0 2px; }
  button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px;
           background:#e94560; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; }
  .info { background:#0f3460; border-radius:8px; padding:12px; margin-top:12px;
          font-size:14px; line-height:1.9; }
  .info b { color:#e94560; }
  #previewWrap { background:#fff; border-radius:12px; padding:10px; margin-top:12px; }
  canvas { width:100%; display:block; }
</style>
</head>
<body>

<h1>📦 مولد الدايكت</h1>
<p class="sub">Reverse Tuck End — زي Templatemaker</p>

<div class="card">
  <h3>المقاسات الأساسية (مم)</h3>
  <div class="row">
    <div><label>Length الطول</label><input type="number" id="L_" value="60"></div>
    <div><label>Width العرض</label><input type="number" id="W_" value="30"></div>
    <div><label>Height الارتفاع</label><input type="number" id="H_" value="90"></div>
  </div>

  <h3>باراميترات اختيارية</h3>
  <div class="row">
    <div><label>Tuck Flap التدبيب</label><input type="number" id="T_" value="20"></div>
    <div><label>Glue Flap اللزمة</label><input type="number" id="G_" value="15"></div>
  </div>
  <div class="row">
    <div><label>Glue Angle الزاوية°</label><input type="number" id="GA_" value="80"></div>
    <div><label>Corner Radius التدوير</label><input type="number" id="R_" value="5"></div>
  </div>
  <div class="row">
    <div><label>Thumb Hole فتحة الإبهام</label><input type="number" id="TH_" value="10"></div>
    <div><label>Dust Flap عمق الدست</label><input type="number" id="D_" value="18"></div>
  </div>

  <h3>الورقة</h3>
  <div class="row">
    <div><label>عرض الورقة</label><input type="number" id="SW_" value="700"></div>
    <div><label>طول الورقة</label><input type="number" id="SH_" value="1000"></div>
  </div>

  <button onclick="generate()">🎨 ارسم واحسب</button>
</div>

<div id="previewWrap" style="display:none;">
  <canvas id="cv"></canvas>
</div>
<div class="info" id="stats" style="display:none;"></div>

<script>
function generate(){
  const L=+L_.value, W=+W_.value, H=+H_.value;
  const T=+T_.value, G=+G_.value, GA=+GA_.value, R=+R_.value, TH=+TH_.value, D=+D_.value;
  const SW=+SW_.value, SH=+SH_.value;
  if(!(L>0&&W>0&&H>0&&T>0&&G>0&&D>0&&SW>0&&SH>0)){ alert('دخل مقاسات صحيحة'); return; }

  // ===== الأبعاد الكلية =====
  const dw = G + L + W + L + W;
  const dh = H + 2*T;

  // ===== التعشيش =====
  function grid(bw,bh){
    const c=Math.floor((SW+2)/bw), r=Math.floor((SH+2)/bh);
    return {c,r,n:c*r};
  }
  const a=grid(dw,dh), b=grid(dh,dw);
  const best=a.n>=b.n?a:b, rot=b.n>a.n;

  // ===== إحداثيات =====
  const xG=0, xA=G, xB=G+L, xC=G+L+W, xD=G+2*L+W, xE=dw;
  const yT=T, yB=yT+H;

  // ===== الرسم =====
  const wrap=document.getElementById('previewWrap');
  wrap.style.display='block';
  const scale=Math.min((wrap.clientWidth-20)/dw, 900/dh);
  const cv=document.getElementById('cv');
  cv.width=dw*scale+20; cv.height=dh*scale+20;
  const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
  g.translate(10,10); g.scale(scale,scale);
  const lw=Math.max(2/scale,0.35);

  const CUT='#ec1e96', FOLD='#00b0c8';

  // ---------- فلاب تدبيب: مستطيل برأس مدوّر (مسار مغلق واحد) ----------
  function tuckFlap(x1,x2,top){
    const r = Math.min(R, (x2-x1)/3, T/2);
    g.strokeStyle=CUT; g.lineWidth=lw; g.setLineDash([]);
    g.beginPath();
    if(top){
      g.moveTo(x1, yT);           // شمال تحت
      g.lineTo(x1, r);            // شمال فوق
      g.arc(x1+r, r, r, Math.PI, 1.5*Math.PI);   // ركن مدوّر شمال
      g.lineTo(x2-r, 0);
      g.arc(x2-r, r, r, 1.5*Math.PI, 2*Math.PI); // ركن مدوّر يمين
      g.lineTo(x2, yT);           // يمين تحت
    }else{
      g.moveTo(x1, yB);
      g.lineTo(x1, dh-r);
      g.arc(x1+r, dh-r, r, Math.PI, 0.5*Math.PI, true);
      g.lineTo(x2-r, dh);
      g.arc(x2-r, dh-r, r, 0.5*Math.PI, 0, true);
      g.lineTo(x2, yB);
    }
    g.stroke();

    // فتحة الإبهام قرب خط الطي
    if(TH>0){
      const thr=TH/2;
      const cy = top ? yT - thr - 4 : yB + thr + 4;
      g.beginPath();
      g.arc((x1+x2)/2, cy, thr, 0, 2*Math.PI);
      g.stroke();
    }
  }

  // ---------- دست فلاب شبه منحرف ----------
  function dustFlap(x1,x2,top){
    const inset=Math.min(5,(x2-x1)*0.18);
    g.strokeStyle=CUT; g.lineWidth=lw; g.setLineDash([]);
    g.beginPath();
    if(top){
      g.moveTo(x1, yT);
      g.lineTo(x1+inset, yT-D);
      g.lineTo(x2-inset, yT-D);
      g.lineTo(x2, yT);
    }else{
      g.moveTo(x1, yB);
      g.lineTo(x1+inset, yB+D);
      g.lineTo(x2-inset, yB+D);
      g.lineTo(x2, yB);
    }
    g.stroke();
  }

  // ---------- حافة مقصوصة مستقيمة (للألواح من غير فلابات) ----------
  function plainCut(x1,x2,top){
    const yy = top ? yT : yB;
    g.strokeStyle=CUT; g.lineWidth=lw; g.setLineDash([]);
    g.beginPath(); g.moveTo(x1,yy); g.lineTo(x2,yy); g.stroke();
  }

  // ================= توزيع الفلابات الصحيح =================
  // فوق: تدبيب على L الأول (xA-xB)
  tuckFlap(xA, xB, true);
  // دست علوي على W الأول (xB-xC)
  dustFlap(xB, xC, true);
  // حافة مستقيمة على L الثاني (xC-xD) — مفيش فلاب
  plainCut(xC, xD, true);
  // دست علوي على W الثاني (xD-xE)
  dustFlap(xD, xE, true);

  // تحت: بالعكس (Reverse Tuck)
  plainCut(xA, xB, false);
  dustFlap(xB, xC, false);
  tuckFlap(xC, xD, false);
  dustFlap(xD, xE, false);

  // ---------- جسم العلبة (مستطيل القص الرئيسي) ----------
  g.strokeStyle=CUT; g.setLineDash([]);
  g.strokeRect(xA, yT, L+W+L+W, H);

  // ---------- اللزمة الجانبية بزاوية ----------
  const off = G / Math.tan(GA*Math.PI/180);
  g.beginPath();
  g.moveTo(xA, yT);
  g.lineTo(xG, yT - off);
  g.lineTo(xG, yB + off);
  g.lineTo(xA, yB);
  g.stroke();

  // ---------- خطوط الطي السماوية ----------
  g.strokeStyle=FOLD; g.lineWidth=lw;
  // طيات رأسية بين الألواح
  [xA,xB,xC,xD].forEach(xx=>{
    g.beginPath(); g.moveTo(xx,yT); g.lineTo(xx,yB); g.stroke();
  });
  // طيات أفقية عند أعلى وأسفل الجسم
  [yT,yB].forEach(yy=>{
    g.beginPath(); g.moveTo(xG,yy); g.lineTo(xE,yy); g.stroke();
  });

  // ---------- كتابة المقاس ----------
  g.fillStyle='#333';
  g.font=`${Math.max(10/scale,3)}px Tahoma`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(`L=${L}`, (xA+xB)/2, (yT+yB)/2);
  g.fillText(`W=${W}`, (xB+xC)/2, (yT+yB)/2);
  g.fillText(`L=${L}`, (xC+xD)/2, (yT+yB)/2);
  g.fillText(`W=${W}`, (xD+xE)/2, (yT+yB)/2);

  // ===== النتيجة =====
  const eff=((best.n*dw*dh/(SW*SH))*100).toFixed(1);
  const st=document.getElementById('stats');
  st.style.display='block';
  st.innerHTML=
   `📐 مقاس الدايكت المسطّح: <b>dw×{dw} ×dw×{dh} مم</b><br>`+
   `🧩 القطع في الورقة (SW×{SW}×SW×{SH}): <b>best.nقطعة</b>({best.n} قطعة</b> (best.nقطعة</b>({best.c} × ${best.r})`+
   (rot?' <span style="color:#2a9d8f">(مدوّرة 90°)</span>':'')+'<br>'+
   `♻️ كفاءة استغلال الورقة: <b>${eff}%</b>`;
}
</script>

</body>
</html>
