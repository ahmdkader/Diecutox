<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد الدايكت - Reverse Tuck End</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body { background:#1a1a2e; color:#eee; padding:15px; }
  h1 { text-align:center; color:#e94560; font-size:22px; margin-bottom:5px; }
  p.sub { text-align:center; color:#888; font-size:13px; margin-bottom:15px; }
  .card { background:#16213e; border-radius:12px; padding:15px; margin-bottom:15px; }
  label { display:block; margin:8px 0 4px; font-size:14px; color:#aaa; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #333;
          background:#0f3460; color:#fff; font-size:16px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px;
           background:#e94560; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; }
  .info { background:#0f3460; border-radius:8px; padding:12px; margin-top:12px;
          font-size:14px; line-height:1.9; }
  .info b { color:#e94560; }
  #previewWrap { background:#fff; border-radius:12px; padding:10px; margin-top:12px; }
  canvas { width:100%; display:block; }
  .legend { display:flex; gap:15px; justify-content:center; margin-top:10px; font-size:13px; }
  .legend span { display:flex; align-items:center; gap:5px; color:#ccc; }
  .l-red { width:25px; border-top:3px solid #d90429; }
  .l-blue { width:25px; border-top:3px dashed #0066ff; }
</style>
</head>
<body>

<h1>📦 مولد الدايكت</h1>
<p class="sub">علبة أدوية — Reverse Tuck End</p>

<div class="card">
  <div class="row">
    <div><label>الطول L</label><input type="number" id="L_" value="80"></div>
    <div><label>العرض W</label><input type="number" id="W_" value="40"></div>
    <div><label>الارتفاع H</label><input type="number" id="H_" value="120"></div>
  </div>
  <div class="row">
    <div><label>عرض الورقة</label><input type="number" id="SW_" value="700"></div>
    <div><label>طول الورقة</label><input type="number" id="SH_" value="1000"></div>
  </div>
  <button onclick="generate()">🎨 ارسم واحسب</button>
</div>

<div id="previewWrap" style="display:none;">
  <canvas id="cv"></canvas>
</div>
<div class="info" id="stats" style="display:none;"></div>

<div class="legend">
  <span><span class="l-red"></span> قص ✂️</span>
  <span><span class="l-blue"></span> طي 📏</span>
</div>

<script>
function generate(){
  const L=+L_.value, W=+W_.value, H=+H_.value;
  const SW=+SW_.value, SH=+SH_.value;
  if(!(L>0 && W>0 && H>0 && SW>0 && SH>0)){ alert('دخل مقاسات صحيحة'); return; }

  // ====== ثوابت التصميم ======
  const glue   = 18;            // اللزمة الجانبية
  const tuck   = Math.min(W*0.7, 18);  // عمق لسان التدبيب
  const dust   = W - 2;         // عمق الدست فلاب (أقل بـ2مم من العرض عشان يقفل)
  const bodyW  = L + W + L + W; // عرض جسم العلبة
  const dw     = glue + bodyW;  // العرض الكلي
  const dh     = tuck + dust + H + dust + tuck; // الطول الكلي

  // ====== حساب التعشيش ======
  function grid(bw,bh){
    const c=Math.max(0,Math.floor((SW+2)/bw)), r=Math.max(0,Math.floor((SH+2)/bh));
    return {c,r,n:c*r};
  }
  const a=grid(dw,dh), b=grid(dh,dw);
  const best=a.n>=b.n?a:b, rot=b.n>a.n;

  // ====== الرسم ======
  // إحداثيات المناطق الرأسية (من فوق لتحت)
  const yTuckTop   = 0;              // فلاب التدبيب العلوي
  const yDustTop   = tuck;           // الدست الفلاب العلوي
  const yBody      = tuck + dust;    // بداية الجسم
  const yBodyEnd   = yBody + H;      // نهاية الجسم
  const yDustBot   = yBodyEnd;       // الدست السفلي
  const yTuckBotEnd= dh;             // نهاية التدبيب السفلي

  // حدود الألواح أفقياً
  const x0 = glue;          // بداية لوح L الأول
  const x1 = x0 + L;
  const x2 = x1 + W;
  const x3 = x2 + L;
  const x4 = x3 + W;        // النهاية = dw

  const cv = document.getElementById('cv');
  const wrap = document.getElementById('previewWrap');
  wrap.style.display='block';
  const avail = wrap.clientWidth - 20;
  const scale = Math.min(avail/dw, 900/dh);
  const pad = 15;
  cv.width  = dw*scale + pad*2;
  cv.height = dh*scale + pad*2;
  const g = cv.getContext('2d');

  // خلفية
  g.fillStyle='#fff';
  g.fillRect(0,0,cv.width,cv.height);
  g.translate(pad,pad);
  g.scale(scale,scale);

  const lw = Math.max(2.2/scale, 0.35); // سماكة الخط

  // ---------- 1) خطوط القص الحمراء ----------
  g.strokeStyle='#d90429';
  g.lineWidth=lw;
  g.setLineDash([]);

  // المحيط الخارجي الكلي (مستطيل الدايكت كله)
  g.strokeRect(0,0,dw,dh);

  // الدست فلاب العلوي: قص جانبيه (خط رأسي من فوق لحد الجسم) على لوحي W
  g.beginPath();
  g.moveTo(x1, yDustTop); g.lineTo(x1, yBody);
  g.moveTo(x3, yDustTop); g.lineTo(x3, yBody);
  g.stroke();

  // الدست فلاب السفلي: نفس الكلام
  g.beginPath();
  g.moveTo(x1, yBodyEnd); g.lineTo(x1, yDustBot+dust);
  g.moveTo(x3, yBodyEnd); g.lineTo(x3, yDustBot+dust);
  g.stroke();

  // فلاب التدبيب العلوي: قص جانبيه على لوح L الأول (من فوق لحد الدست)
  g.beginPath();
  g.moveTo(x0, yTuckTop); g.lineTo(x0, yDustTop);
  g.moveTo(x1, yTuckTop); g.lineTo(x1, yDustTop);
  g.stroke();

  // فلاب التدبيب السفلي: على لوح L الثاني (معاكس - Reverse Tuck)
  g.beginPath();
  g.moveTo(x2, yBodyEnd+dust); g.lineTo(x2, yTuckBotEnd);
  g.moveTo(x3, yBodyEnd+dust); g.lineTo(x3, yTuckBotEnd);
  g.stroke();

  // ---------- 2) خطوط الطي الزرقاء ----------
  g.strokeStyle='#0066ff';
  g.lineWidth=lw*0.85;
  g.setLineDash([6/scale, 4/scale]);

  // الطيات الرأسية بين الألواح (على كامل الارتفاع)
  [x0,x1,x2,x3].forEach(xx=>{
    g.beginPath(); g.moveTo(xx,0); g.lineTo(xx,dh); g.stroke();
  });

  // الطيات الأفقية: قاعدة كل فلاب
  [yDustTop, yBody, yBodyEnd, yBodyEnd+dust].forEach(yy=>{
    g.beginPath(); g.moveTo(0,yy); g.lineTo(dw,yy); g.stroke();
  });

  g.setLineDash([]);

  // ---------- 3) كتابة الأبعاد على الرسم ----------
  g.fillStyle='#333';
  g.font = `${Math.max(11/scale,3)}px Tahoma`;
  g.textAlign='center';
  g.fillText(`L=${L}`, (x0+x1)/2, yBody+H/2);
  g.fillText(`W=${W}`, (x1+x2)/2, yBody+H/2);
  g.fillText(`L=${L}`, (x2+x3)/2, yBody+H/2);
  g.fillText(`W=${W}`, (x3+x4)/2, yBody+H/2);
  g.fillText(`Glue=${glue}`, glue/2, yBody+H/2);

  // ====== النتيجة ======
  const eff=((best.n*dw*dh/(SW*SH))*100).toFixed(1);
  const st=document.getElementById('stats');
  st.style.display='block';
  st.innerHTML =
   `📐 مقاس الدايكت المسطّح: <b>dw×{dw} ×dw×{dh} مم</b><br>`+
   `🧩 القطع في الورقة (SW×{SW}×SW×{SH}): <b>best.nقطعة</b>({best.n} قطعة</b> (best.nقطعة</b>({best.c} × ${best.r})`+
   (rot?' <span style="color:#2a9d8f">(مدوّرة 90°)</span>':'')+'<br>'+
   `♻️ كفاءة استغلال الورقة: <b>${eff}%</b>`;
}
</script>

</body>
</html>
