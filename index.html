<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد الدايكت - Reverse Tuck End</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body { background:#1a1a2e; color:#eee; padding:15px; }
  h1 { text-align:center; color:#e94560; font-size:22px; margin-bottom:5px; }
  p.sub { text-align:center; color:#888; font-size:13px; margin-bottom:15px; }
  .card { background:#16213e; border-radius:12px; padding:15px; margin-bottom:15px; }
  label { display:block; margin:8px 0 4px; font-size:14px; color:#aaa; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #333;
          background:#0f3460; color:#fff; font-size:16px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px;
           background:#e94560; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; }
  .info { background:#0f3460; border-radius:8px; padding:12px; margin-top:12px;
          font-size:14px; line-height:1.9; }
  .info b { color:#e94560; }
  #previewWrap { background:#fff; border-radius:12px; padding:10px; margin-top:12px; }
  canvas { width:100%; display:block; }
</style>
</head>
<body>

<h1>📦 مولد الدايكت</h1>
<p class="sub">علبة أدوية — Reverse Tuck End (زي العينة)</p>

<div class="card">
  <div class="row">
    <div><label>الطول L</label><input type="number" id="L_" value="85"></div>
    <div><label>العرض W</label><input type="number" id="W_" value="80"></div>
    <div><label>الارتفاع H</label><input type="number" id="H_" value="340"></div>
  </div>
  <div class="row">
    <div><label>عرض الورقة</label><input type="number" id="SW_" value="700"></div>
    <div><label>طول الورقة</label><input type="number" id="SH_" value="1000"></div>
  </div>
  <button onclick="generate()">🎨 ارسم واحسب</button>
</div>

<div id="previewWrap" style="display:none;">
  <canvas id="cv"></canvas>
</div>
<div class="info" id="stats" style="display:none;"></div>

<script>
function generate(){
  const L=+L_.value, W=+W_.value, H=+H_.value;
  const SW=+SW_.value, SH=+SH_.value;
  if(!(L>0&&W>0&&H>0&&SW>0&&SH>0)){ alert('دخل مقاسات صحيحة'); return; }

  // ===== ثوابت التصميم (نسب من العينة) =====
  const gL = Math.max(15, W*0.25);        // اللزمة العريضة شمال
  const gR = Math.max(7,  W*0.10);        // اللزمة الضيقة يمين
  const T  = Math.min(W*0.55, 45);        // عمق التدبيب الكلي
  const D  = Math.min(W*0.55, 45);        // عمق الدست فلاب
  const r  = Math.min(W*0.18, 16);        // نصف قطر رأس التدبيب المدوّر

  const dw = gL + L+W+L+W + gR;           // العرض الكلي
  const dh = H + 2*(T+D);                 // الطول الكلي

  // ===== التعشيش =====
  function grid(bw,bh){
    const c=Math.floor((SW+2)/bw), rr=Math.floor((SH+2)/bh);
    return {c,r:rr,n:c*rr};
  }
  const a=grid(dw,dh), b=grid(dh,dw);
  const best=a.n>=b.n?a:b, rot=b.n>a.n;

  // ===== إحداثيات =====
  const xG1=0, xA=gL, xB=gL+L, xC=gL+L+W, xD=gL+2*L+W, xE=dw-gR, xF=dw;
  const yB = T+D;          // بداية الجسم (فوق)
  const yE = yB+H;         // نهاية الجسم
  const yDust = yB-D;      // أعلى الدست فلاب
  const yTuck = 0;         // أعلى التدبيب

  // ===== الرسم =====
  const wrap=document.getElementById('previewWrap');
  wrap.style.display='block';
  const avail=wrap.clientWidth-20;
  const scale=Math.min(avail/dw, 900/dh);
  const pad=15;
  const cv=document.getElementById('cv');
  cv.width=dw*scale+pad*2; cv.height=dh*scale+pad*2;
  const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
  g.translate(pad,pad); g.scale(scale,scale);
  const lw=Math.max(2/scale,0.35);

  // ---------- دالة رسم طرف كامل (فوق أو تحت) ----------
  function drawEnd(top){
    // الإشارة: فوق نرسم لأعلى، تحت نرسم لأسفل
    const s = top ? -1 : 1;
    const yBase = top ? yB : yE;   // خط الجسم

    // --- التدبيب على لوح L الأول (xA→xB) ---
    let xa=xA, xb=xB;
    if(!top){ xa=xC; xb=xD; }   // Reverse Tuck: التدبيب السفلي معاكس
    const yt = yBase + s*(T+D); // أعلى/أسفل التدبيب
    const yd = yBase + s*D;     // مستوى الدست فلاب
    const inset = 3;

    g.strokeStyle='#ed1c24'; g.lineWidth=lw; g.setLineDash([]);
    g.beginPath();
    // جانب التدبيب الأيسر
    g.moveTo(xa+inset, yd);
    g.lineTo(xa+inset, yt + s*r);
    // الرأس المدوّر
    g.arc(xa+inset+r, yt+s*r, r, Math.PI, 0, !top);
    // الجانب الأيمن للرأس
    g.moveTo(xb-inset-r, yt+s*r);
    g.lineTo(xb-inset, yt+s*r);
    g.lineTo(xb-inset, yd);
    g.stroke();

    // كتاف التدبيب المقصوصة (الدرجات الصغيرة عند الرأس)
    const sh=Math.min(r*0.55,9);
    g.beginPath();
    g.moveTo(xa+inset, yt+s*(r+sh)); g.lineTo(xa+inset+sh, yt+s*(r+sh));
    g.lineTo(xa+inset+sh, yt+s*r);
    g.moveTo(xb-inset, yt+s*(r+sh)); g.lineTo(xb-inset-sh, yt+s*(r+sh));
    g.lineTo(xb-inset-sh, yt+s*r);
    g.stroke();

    // --- الدست فلاب على لوح W (بزوايا مايلة) ---
    let xw1, xw2;
    if(top){ xw1=xB; xw2=xC; } else { xw1=xB; xw2=xC; }
    const ang=D*0.45;
    g.beginPath();
    g.moveTo(xw1, yBase);
    g.lineTo(xw1, yd + s*ang);
    g.lineTo(xw1+ang*0.7, yd);
    g.lineTo(xw2-ang*0.7, yd);
    g.lineTo(xw2, yd + s*ang);
    g.lineTo(xw2, yBase);
    g.stroke();

    // --- الدست فلاب الثاني على لوح W الآخر ---
    if(top){ xw1=xD; xw2=xE; } else { xw1=xD; xw2=xE; }
    g.beginPath();
    g.moveTo(xw1, yBase);
    g.lineTo(xw1, yd + s*ang);
    g.lineTo(xw1+ang*0.7, yd);
    g.lineTo(xw2-ang*0.7, yd);
    g.lineTo(xw2, yd + s*ang);
    g.lineTo(xw2, yBase);
    g.stroke();
  }

  drawEnd(true);   // الطرف العلوي
  drawEnd(false);  // الطرف السفلي

  // ---------- اللزمة الشمال (عريضة بحواف مايلة) ----------
  g.strokeStyle='#ed1c24'; g.setLineDash([]);
  g.beginPath();
  g.moveTo(xA, yB);
  g.lineTo(xG1, yB - D*0.3);
  g.lineTo(xG1, yE + D*0.3);
  g.lineTo(xA, yE);
  g.stroke();

  // ---------- اللزمة اليمين (ضيقة بحواف مايلة) ----------
  g.beginPath();
  g.moveTo(xE, yB);
  g.lineTo(xF, yB + D*0.15);
  g.lineTo(xF, yE - D*0.15);
  g.lineTo(xE, yE);
  g.stroke();

  // ---------- خطوط الطي الخضراء ----------
  g.strokeStyle='#00a651'; g.lineWidth=lw; g.setLineDash([]);

  // الطيات الرأسية بين الألواح (على ارتفاع الجسم فقط زي العينة)
  [xA,xB,xC,xD].forEach(xx=>{
    g.beginPath(); g.moveTo(xx,yB); g.lineTo(xx,yE); g.stroke();
  });

  // طي قاعدة كل فلاب (أفقي عند مستوى الدست والتدبيب)
  [[yDust,yB],[yE,yE+D]].forEach(([y1,y2])=>{
    g.beginPath(); g.moveTo(xA,y1); g.lineTo(xE,y1); g.stroke();
    g.beginPath(); g.moveTo(xA,y2); g.lineTo(xE,y2); g.stroke();
  });

  // ===== كتابة الأبعاد =====
  g.fillStyle='#333';
  g.font=`${Math.max(11/scale,3)}px Tahoma`;
  g.textAlign='center';
  g.fillText(`L=${L}`, (xA+xB)/2, yB+H/2);
  g.fillText(`W=${W}`, (xB+xC)/2, yB+H/2);
  g.fillText(`L=${L}`, (xC+xD)/2, yB+H/2);
  g.fillText(`W=${W}`, (xD+xE)/2, yB+H/2);

  // ===== النتيجة =====
  const eff=((best.n*dw*dh/(SW*SH))*100).toFixed(1);
  const st=document.getElementById('stats');
  st.style.display='block';
  st.innerHTML=
   `📐 مقاس الدايكت المسطّح: <b>dw.toFixed(1)×{dw.toFixed(1)} ×dw.toFixed(1)×{dh.toFixed(1)} مم</b><br>`+
   `🧩 القطع في الورقة (SW×{SW}×SW×{SH}): <b>best.nقطعة</b>({best.n} قطعة</b> (best.nقطعة</b>({best.c} × ${best.r})`+
   (rot?' <span style="color:#2a9d8f">(مدوّرة 90°)</span>':'')+'<br>'+
   `♻️ كفاءة استغلال الورقة: <b>${eff}%</b>`;
}
</script>

</body>
</html>
